# Builds a final release version and pushes to nuget.org 
# whenever a release is published.
# Requires: vars.NUGET_OIDC or secrets.NUGET_OIDC (nuget.org username for OIDC trusted publishing)
#
# The ports are published by the jobs below, only for a final release (not a prerelease), all
# with the version of the release tag that the job `version` computes (v1.0.0-alpha publishes
# 1.0.0-alpha, 1.0.0a0 on PyPI), written into each manifest before it builds, and only when the
# registry does not have that version yet, so a rerun skips what it published. Publishing to the
# registry needs no secret:
#   npm       @devlooped/jqlite   trusted publisher of the package (OIDC)
#   crates    jqlite              trusted publisher of the crate (OIDC)
#   PyPI      devlooped-jqlite    trusted publisher of the project (OIDC)
#   Maven     com.devlooped:jqlite  secrets.CENTRAL_USERNAME, CENTRAL_PASSWORD (a Central Portal
#                                 user token), MAVEN_GPG_KEY (armored private key), MAVEN_GPG_PASSPHRASE
#   Go        github.com/devlooped/jqlite/go  the tag go/<release tag>, made by the job below

name: publish
on:
  release:
    types: [prereleased, released]

env:
  DOTNET_NOLOGO: true
  Configuration: Release
  PackOnBuild: true
  GeneratePackageOnBuild: true
  VersionLabel: refs/tags/${{ github.event.release.tag_name }}
  GH_TOKEN: ${{ secrets.GH_TOKEN }}
  MSBUILDTERMINALLOGGER: auto
  SLEET_FEED_URL: https://api.nuget.org/v3/index.json
      
jobs:
  publish:
    runs-on: ${{ vars.PUBLISH_AGENT || 'ubuntu-latest' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4
        with: 
          submodules: recursive
          fetch-depth: 0

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: 🙏 build
        run: dotnet build -m:1 -bl:build.binlog

      - name: 🧪 test
        shell: pwsh
        run: dnx --yes retest -- --no-build

      - name: 🐛 logs
        uses: actions/upload-artifact@v4
        if: runner.debug && always()
        with:
          name: logs
          path: '*.binlog'

      - name: ✅ validate
        shell: pwsh
        working-directory: bin
        run: |
          $invalid = Get-ChildItem -File -Filter "*.42.42*.nupkg"
          if ($invalid) {
            Write-Error "Found dev/local packages with disallowed 42.42* version prefix:`n$($invalid.Name -join "`n")"
            exit 1
          }

      # Trusted publishing policy on https://www.nuget.org/account/trustedpublishing:
      #   Package owner: Devlooped
      #   Repository: devlooped/jqlite
      #   Workflow file: publish.yml
      #   Environment: (none)
      # NUGET_OIDC is the nuget.org user that created the policy (kzu), not the
      # Devlooped organization: nuget.org rejects token exchange for an organization.
      # https://learn.microsoft.com/nuget/nuget-org/trusted-publishing
      - name: 🔑 nuget login
        id: login
        env:
          NUGET_OIDC: ${{ vars.NUGET_OIDC || secrets.NUGET_OIDC }}
        if: ${{ env.NUGET_OIDC != '' && github.event.action != 'prereleased' }}
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_OIDC || secrets.NUGET_OIDC }}

      - name: 🚀 nuget
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        if: ${{ steps.login.outcome == 'success' }}
        shell: pwsh
        working-directory: bin
        run: dotnet nuget push *.nupkg -s https://api.nuget.org/v3/index.json -k $env:NUGET_API_KEY --skip-duplicate

      - name: 🚀 sleet
        env:
          SLEET_CONNECTION: ${{ secrets.SLEET_CONNECTION }}
        if: env.SLEET_CONNECTION != ''
        run: |
          dotnet tool update sleet -g --allow-downgrade --version $(curl -s --compressed ${{ vars.SLEET_FEED_URL }} | jq '.["sleet:version"]' -r)        
          sleet push bin --config none -f --verbose -p "SLEET_FEED_CONTAINER=nuget" -p "SLEET_FEED_CONNECTIONSTRING=${{ secrets.SLEET_CONNECTION }}" -p "SLEET_FEED_TYPE=azure" || echo "No packages found"

  # The version of every port: the one the .NET build makes of the release tag (VersionLabel, in
  # dotnet/Directory.Build.props), so that every package of a release has the same version.
  version:
    if: github.event.action == 'released'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4

      - name: ⚙ dotnet
        uses: devlooped/actions-dotnet-env@v1

      - name: 🔢 version
        id: version
        run: |
          version=$(dotnet msbuild dotnet/JQLite/JQLite.csproj -getProperty:Version)
          if [[ -z "$version" || "$version" == 42.42.* ]]; then
            echo "::error::The release tag ${{ github.event.release.tag_name }} gives no release version ('$version')"
            exit 1
          fi
          echo "Version: $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  npm:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: typescript
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4

      - name: ⚙ node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # A prerelease goes under the dist-tag `next`, so that `latest` stays the last final version.
      - name: 🔎 version
        id: version
        run: |
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          name=$(node -p "require('./package.json').name")
          if [[ "$VERSION" == *-* ]]; then tag=next; else tag=latest; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if npm view "$name@$VERSION" version > /dev/null 2>&1; then
            echo "$name@$VERSION is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🧪 test
        if: steps.version.outputs.publish == 'true'
        run: |
          npm ci
          npm test

      - name: 🚀 npm
        if: steps.version.outputs.publish == 'true'
        run: npm publish --access public --tag ${{ steps.version.outputs.tag }}

  pypi:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4

      - name: ⚙ python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # PyPI takes the PEP 440 form of the version: 1.0.0-alpha is 1.0.0a0.
      - name: 🔢 version
        working-directory: python
        run: |
          python -m pip install build packaging
          version=$(python -c "import sys; from packaging.version import Version; print(Version(sys.argv[1]))" "$VERSION")
          sed -i "s/^version = \".*\"/version = \"$version\"/" pyproject.toml
          grep -q "^version = \"$version\"" pyproject.toml
          echo "Version: $version"

      - name: 🧪 test
        working-directory: python
        run: python -m unittest

      - name: 🙏 build
        working-directory: python
        run: python -m build

      - name: 🚀 pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: python/dist
          skip-existing: true

  crates:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        working-directory: rust
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4

      # The first `version =` of Cargo.toml is the one of [package].
      - name: 🔎 version
        id: version
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          test "$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "jqlite") | .version')" = "$VERSION"
          if curl -fsS -A "devlooped/jqlite publish" "https://crates.io/api/v1/crates/jqlite/$VERSION" > /dev/null; then
            echo "jqlite $VERSION is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🧪 test
        if: steps.version.outputs.publish == 'true'
        run: cargo test -p jqlite

      - name: 🔑 auth
        if: steps.version.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: 🚀 crates.io
        if: steps.version.outputs.publish == 'true'
        run: cargo publish -p jqlite --allow-dirty
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  maven:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.version.outputs.version }}
      CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
      CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
      MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
    defaults:
      run:
        working-directory: java
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4

      - name: ⚙ java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.MAVEN_GPG_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: 🔎 version
        id: version
        run: |
          ./mvnw -B -q versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          test "$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)" = "$VERSION"
          if curl -fsS -o /dev/null "https://repo1.maven.org/maven2/com/devlooped/jqlite/$VERSION/jqlite-$VERSION.pom"; then
            echo "com.devlooped:jqlite:$VERSION is already published"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 🚀 maven central
        if: steps.version.outputs.publish == 'true' && env.CENTRAL_USERNAME != ''
        run: ./mvnw -B -Prelease deploy

  go:
    if: github.event.action == 'released'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🤘 checkout
        uses: actions/checkout@v4

      # The module is in go/, so its versions are the tags go/vX.Y.Z; the proxy serves a tag as soon as
      # it is asked for it, and pkg.go.dev lists it after that.
      - name: 🚀 go
        run: |
          tag="go/${{ github.event.release.tag_name }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag exists"
          else
            git tag "$tag" "$GITHUB_SHA"
            git push origin "$tag"
          fi
          curl -fsS "https://proxy.golang.org/github.com/devlooped/jqlite/go/@v/${{ github.event.release.tag_name }}.info" || true
