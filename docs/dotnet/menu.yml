# The same pages, under the same names, as every other implementation (jqlite_topics in
# ../config.scriban). The API reference is generated (api.dotnet in ../config.scriban).
dotnet:
  - {path: readme.md, title: "<i class='bi bi-rocket-takeoff' aria-hidden='true'></i> Overview"}
  - {path: evaluate.md, title: "<i class='bi bi-play' aria-hidden='true'></i> Evaluating"}
  - {path: values.md, title: "<i class='bi bi-box' aria-hidden='true'></i> Values"}
  - {path: variables.md, title: "<i class='bi bi-currency-dollar' aria-hidden='true'></i> Variables"}
  - {path: options.md, title: "<i class='bi bi-sliders' aria-hidden='true'></i> Options"}
  - {path: modules.md, title: "<i class='bi bi-boxes' aria-hidden='true'></i> Modules"}
  - {path: errors.md, title: "<i class='bi bi-exclamation-triangle' aria-hidden='true'></i> Errors"}
  - {path: jsonl.md, title: "<i class='bi bi-list-ol' aria-hidden='true'></i> JSON Lines"}
  - {path: api/readme.md, title: "<i class='bi bi-braces' aria-hidden='true'></i> API reference", folder: true}
  - {path: upgrading.md, title: "<i class='bi bi-arrow-up-circle' aria-hidden='true'></i> Upgrading from 1.x"}
  - {url: "https://github.com/devlooped/jqlite/blob/main/changelog.md", title: "<i class='bi bi-clock-history' aria-hidden='true'></i> Changelog"}
